version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: gzacinema-client
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    networks:
      - gzacinema-net

networks:
  gzacinema-net:
    external: true
