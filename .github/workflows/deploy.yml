name: Deploy Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: "/home/ubuntu/workspace/gzacinema/gzacinema-client"

jobs:
  check_runner:
    name: Check Runner Environment
    runs-on: self-hosted
    steps:
      - name: System & Runner Info
        run: |
          hostname
          hostname -I || true
          ip route show || true
          whoami
          pwd
          pm2 list || true
          docker ps || true

  deploy_job:
    name: Deploy Client
    needs: check_runner
    runs-on: self-hosted
    steps:
      - name: Build & Deploy PM2 SPA
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          # 1. Di chuyển vào thư mục deploy thực tế
          cd $DEPLOY_PATH

          # Khắc phục lỗi dubious ownership
          git config --global --add safe.directory $DEPLOY_PATH || true

          # 2. Cập nhật file .env từ GitHub Secret nếu có
          if [ -n "$ENV_CONTENT" ]; then
            echo "$ENV_CONTENT" > .env
            echo "--> Đã cập nhật file .env từ GitHub Secret."
          fi

          # 3. Lấy mã SHA của commit hiện tại trước khi pull
          OLD_SHA=$(git rev-parse HEAD)

          # 3. Pull code mới nhất
          git fetch origin main
          git reset --hard origin/main

          # 4. Lấy mã SHA của commit mới sau khi pull
          NEW_SHA=$(git rev-parse HEAD)

          # 5. Kiểm tra và cài đặt/cập nhật dependencies nếu package.json/package-lock.json thay đổi
          if [ ! -d "node_modules" ]; then
            echo "node_modules không tồn tại. Đang chạy npm install..."
            npm install --prefer-offline --no-audit
          elif [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "Không có commit mới (SHA không đổi). Bỏ qua kiểm tra package.json."
          elif git diff --name-only $OLD_SHA $NEW_SHA | grep -E "package.json|package-lock.json" > /dev/null; then
            echo "Phát hiện package.json hoặc package-lock.json thay đổi. Đang chạy npm install..."
            npm install --prefer-offline --no-audit
          else
            echo "package.json không đổi. Bỏ qua npm install."
          fi

          # 6. Build production bundle (HTML, JS, CSS)
          echo "Đang build production bundle..."
          npm run build

          # 7. Khởi động lại dự án bằng PM2 với file ecosystem.config.cjs
          pm2 reload ecosystem.config.cjs || pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs
          pm2 save

          # 8. Health check
          curl --retry 10 --retry-delay 2 --retry-connrefused -f http://127.0.0.1:5173 || exit 1
          echo "✅ Client deployed & verified successfully!"
